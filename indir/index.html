<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pythia'yı İndir — Rüya Tabiri, Tarot & Burç</title>
<meta name="description" content="Pythia'yı ücretsiz indir: AI rüya tabiri, tarot falı, burç yorumu. 3 gün ücretsiz." />
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="../pythia-icon-512.png" />
<style>
  :root{--accent:#a855f7;--gold:#d4a843;--text:#f5f0ff;--muted:#b8a8d9}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(ellipse at top,#140a2e 0%,#080516 60%);
    color:var(--text);min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    text-align:center;padding:24px;overflow:hidden;
  }
  .stars{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.6;
    background-image:radial-gradient(1px 1px at 20% 30%,#fff,transparent),
      radial-gradient(2px 2px at 70% 60%,#c084fc,transparent),
      radial-gradient(1px 1px at 85% 20%,#fff,transparent),
      radial-gradient(1px 1px at 35% 80%,#e9d5ff,transparent);
    background-size:600px 600px;animation:tw 7s ease-in-out infinite alternate}
  @keyframes tw{from{opacity:.35}to{opacity:.75}}
  .card{position:relative;z-index:1;max-width:420px;width:100%}
  .logo{width:128px;height:128px;border-radius:30px;margin:0 auto 22px;display:block;
    box-shadow:0 12px 40px rgba(168,85,247,.4);filter:drop-shadow(0 0 30px rgba(168,85,247,.5))}
  h1{font-size:40px;font-weight:800;letter-spacing:.04em;
    background:linear-gradient(135deg,#fff,#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:10px}
  .tag{color:var(--muted);font-size:16px;line-height:1.5;margin-bottom:28px}
  .cta{display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;background:var(--gold);color:#0e0a1f;text-decoration:none;
    padding:18px 24px;border-radius:16px;font-weight:800;font-size:19px;letter-spacing:.5px;
    box-shadow:0 8px 30px rgba(212,168,67,.45);transition:transform .15s}
  .cta:active{transform:scale(.97)}
  .cta svg{width:26px;height:26px;flex-shrink:0}
  .cta.secondary{background:rgba(255,255,255,.08);color:var(--text);
    border:1px solid rgba(168,85,247,.35);box-shadow:none;font-size:16px;padding:14px 24px;margin-top:12px}
  .free{margin-top:18px;color:var(--gold);font-size:15px;font-weight:600}
  .hint{margin-top:14px;color:var(--muted);font-size:13px;opacity:.8}
  .hidden{display:none}
</style>
</head>
<body>
<div class="stars"></div>
<div class="card">
  <img class="logo" src="../pythia-icon-1024.png" alt="Pythia" />
  <h1>PYTHIA</h1>
  <p class="tag">AI ile rüya tabiri, tarot falı ve burç yorumu — hepsi tek uygulamada 🔮</p>

  <div id="ctaArea"></div>

  <p class="free">🎁 3 gün ücretsiz dene</p>
  <p class="hint" id="hint"></p>
</div>

<script>
  var IOS = "https://apps.apple.com/tr/app/pythia-r%C3%BCya-tabiri-tarot-bur%C3%A7/id6760260260";
  var ANDROID = "https://play.google.com/store/apps/details?id=com.ruyatabircisi.ai&hl=tr";

  var APPLE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5C17.88 20.74 17 21.95 15.66 21.97C14.32 22 13.89 21.18 12.37 21.18C10.84 21.18 10.37 21.95 9.1 22C7.78 22.05 6.8 20.68 5.96 19.47C4.25 17 2.94 12.45 4.7 9.39C5.57 7.87 7.13 6.91 8.82 6.88C10.1 6.86 11.32 7.75 12.11 7.75C12.89 7.75 14.37 6.68 15.92 6.84C16.57 6.87 18.39 7.1 19.56 8.82C19.47 8.88 17.39 10.1 17.41 12.63C17.44 15.65 20.06 16.66 20.09 16.67C20.06 16.74 19.67 18.11 18.71 19.5ZM13 3.5C13.73 2.67 14.94 2.04 15.94 2C16.07 3.17 15.6 4.35 14.9 5.19C14.21 6.04 13.07 6.7 11.95 6.61C11.8 5.46 12.36 4.26 13 3.5Z"/></svg>';
  var PLAY_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.609 1.814 13.792 12 3.609 22.186a.996.996 0 0 1-.609-.92V2.734a.996.996 0 0 1 .609-.92zM14.5 12.707l2.302 2.302-9.997 5.774L14.5 12.707zm0-1.414L6.805 3.217l9.997 5.774L14.5 11.293zm3.013-1.997 2.69 1.553c.78.45.78 1.728 0 2.178l-2.69 1.553L15.207 12l2.306-2.704z"/></svg>';

  var ua = navigator.userAgent || navigator.vendor || "";
  var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isAndroid = /android/i.test(ua);
  var area = document.getElementById("ctaArea");
  var hint = document.getElementById("hint");

  function btn(href, svg, label, secondary) {
    var a = document.createElement("a");
    a.href = href; a.className = "cta" + (secondary ? " secondary" : "");
    a.rel = "noopener"; a.innerHTML = svg + "<span>" + label + "</span>";
    return a;
  }

  if (isIOS) {
    area.appendChild(btn(IOS, APPLE_SVG, "App Store'dan İndir", false));
    hint.textContent = "Yönlendiriliyorsun…";
    setTimeout(function(){ window.location.href = IOS; }, 1200);
  } else if (isAndroid) {
    area.appendChild(btn(ANDROID, PLAY_SVG, "Google Play'den İndir", false));
    hint.textContent = "Yönlendiriliyorsun…";
    setTimeout(function(){ window.location.href = ANDROID; }, 1200);
  } else {
    // Masaüstü / bilinmeyen → ikisini de göster
    area.appendChild(btn(IOS, APPLE_SVG, "App Store", false));
    area.appendChild(btn(ANDROID, PLAY_SVG, "Google Play", true));
    hint.textContent = "Telefonundan açarsan doğru mağazaya direkt gider.";
  }
</script>
</body>
</html>
